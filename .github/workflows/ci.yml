# Checks on every push and pull request.
#
# The race detector is here rather than only in a developer's hands because it
# needs a C toolchain, which a Windows workstation may not have. The licence
# audit is here because LICENCE.md restricts a field of endeavour and so cannot
# be combined with copyleft dependencies — see docs/DECISIONS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # Nothing to cache: the backend has no third-party dependencies, and
          # there is no go.sum for the cache key to read.
          cache: false

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests, with the race detector
        run: go test -race ./...

      - name: Build the server
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Dependency licences are compatible with LICENCE.md
        run: npm run licences

      - name: Types and build
        run: npm run build
